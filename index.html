<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afifa's HTML Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-canvas: #fdf6fb;
            --pink-accent: #ff4081;
            --pink-soft: #fce4ec;
            --pink-deep: #c2185b;
            --mint-green: #00e676;
            --mint-deep: #00a854;
            --purple-border: #7b1fa2;
            --purple-light: #f3e5f5;
            --amber: #ffb300;
            --dark-ink: #263238;
            --gray-locked: #cfd8dc;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(#ffcdd2 15%, transparent 16%),
                radial-gradient(#e1bee7 15%, transparent 16%);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            color: var(--dark-ink);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        #app { display: flex; width: 100vw; height: 100vh; }

        #sidebar {
            width: 340px;
            background: var(--white);
            border-right: 4px solid var(--purple-border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(123, 31, 162, 0.08);
            z-index: 10;
        }

        .brand-header {
            padding: 16px 20px;
            background: var(--pink-soft);
            border-bottom: 4px solid var(--purple-border);
            text-align: center;
        }

        .brand-header h1 {
            font-size: 1.45rem;
            color: var(--pink-deep);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px 14px;
            background: #fff;
            border-bottom: 3px solid #eee;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .stat-pill {
            background: var(--purple-light);
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid var(--purple-border);
            color: var(--purple-border);
        }

        .syllabus-scroll { flex: 1; overflow-y: auto; padding: 14px 12px; }

        .chapter-group {
            margin-bottom: 18px;
            background: #fafafa;
            border: 3px solid #e0e0e0;
            border-radius: 16px;
            overflow: hidden;
        }

        .chapter-header {
            padding: 10px 14px;
            background: #eceff1;
            font-weight: 700;
            font-size: 0.92rem;
            color: #455a64;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            border-top: 1px dashed #e0e0e0;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .exercise-item:hover:not(.locked) { background: var(--purple-light); }
        .exercise-item.active { background: #ffecb3; color: #d84315; border-left: 6px solid var(--amber); }
        .exercise-item.locked { opacity: 0.45; cursor: not-allowed; color: #78909c; }
        .exercise-item.completed .badge { background: var(--mint-green); color: white; border-color: var(--mint-deep); }

        .badge {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: white; border: 2px solid #b0bec5;
            font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
        }

        #workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        #topbar {
            height: 64px; background: white; border-bottom: 4px solid var(--purple-border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
        }

        .current-tag { font-size: 1.25rem; font-weight: 700; color: var(--purple-border); }
        .action-tools { display: flex; gap: 10px; }

        /* Standard 3-Column Grid */
        #stage-grid {
            flex: 1; display: grid; grid-template-columns: 350px 1fr 1fr;
            gap: 16px; padding: 16px; overflow: hidden;
        }

        .stage-box {
            background: white; border: 4px solid var(--purple-border);
            border-radius: 20px; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 8px 0 rgba(123, 31, 162, 0.15);
        }

        .stage-box-header {
            padding: 10px 16px; font-weight: 700; font-size: 1rem;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 3px solid #eee;
        }

        #panel-instructions { background: #fffdfd; }

        .mascot-stage {
            padding: 14px; display: flex; align-items: center; gap: 12px;
            background: var(--pink-soft); border-bottom: 3px dashed #f48fb1;
        }

        .bunny-svg {
            width: 78px; height: 78px; flex-shrink: 0;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
            animation: rabbitFloat 3s ease-in-out infinite;
        }

        @keyframes rabbitFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .dialogue-balloon {
            background: white; border: 3px solid var(--pink-accent);
            border-radius: 16px; border-bottom-left-radius: 4px;
            padding: 10px 12px; font-size: 0.95rem; line-height: 1.35;
            color: #37474f; position: relative;
        }

        .mission-body { padding: 16px; overflow-y: auto; flex: 1; font-size: 1.05rem; line-height: 1.5; }
        .mission-body h3 { color: var(--pink-deep); margin-bottom: 8px; font-size: 1.2rem; }
        .mission-desc { margin-bottom: 14px; color: #263238; white-space: pre-wrap; font-size: 1.1rem; }

        .tasks-box {
            background: #f1f8e9; border: 2px solid #aed581;
            border-radius: 12px; padding: 12px; margin-bottom: 14px;
        }

        .tasks-box h4 {
            color: #33691e; font-size: 1rem; margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item { display: flex; align-items: flex-start; gap: 10px; font-size: 1rem; font-weight: 600; color: #1b5e20; }

        .task-checkbox {
            width: 22px; height: 22px; border-radius: 6px;
            border: 2px solid #689f38; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; background: white; color: white;
            font-size: 0.8rem; font-weight: 700; margin-top: 1px;
        }

        .task-item.complete .task-checkbox { background: var(--mint-green); border-color: var(--mint-deep); }

        .hint-drawer {
            margin-top: 10px; padding: 12px; background: #fff8e1;
            border: 2px dashed #ffe082; border-radius: 10px;
            font-size: 1.1rem; color: #d84315; display: none;
            white-space: pre-wrap; font-family: 'Fira Code', monospace; font-weight: bold;
        }

        #panel-editor { position: relative; }

        .code-textarea {
            flex: 1; width: 100%; height: 100%; border: none; padding: 16px;
            font-family: 'Fira Code', monospace; font-size: 1.25rem; line-height: 1.6;
            background: #282a36; color: #f8f8f2; resize: none; outline: none; user-select: text;
        }

        #panel-preview { background: #ffffff; }
        .preview-frame-wrap { flex: 1; width: 100%; height: 100%; background: white; overflow: auto; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        .cartoon-btn {
            font-family: 'Fredoka', cursive, sans-serif; font-weight: 700;
            font-size: 1.1rem; padding: 8px 18px; border-radius: 12px; cursor: pointer;
            border: 3px solid var(--dark-ink); box-shadow: 0 4px 0 var(--dark-ink);
            transition: all 0.08s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }

        .cartoon-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--dark-ink); }
        .btn-check { background: var(--mint-green); color: #003300; }
        .btn-hint { background: var(--amber); color: #3e2723; }
        .btn-reset { background: #eeeeee; color: #424242; font-size: 0.95rem; padding: 6px 12px; }

        #celebration-screen {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.94);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; padding: 24px;
        }

        #celebration-screen h2 { font-size: 3.5rem; color: var(--pink-deep); margin: 15px 0 10px; text-shadow: 3px 3px 0 #ffd7e8; }
        #celebration-screen p { font-size: 1.6rem; color: #455a64; max-width: 550px; margin-bottom: 25px; font-weight: bold; }

        .big-bunny { width: 170px; height: 170px; animation: rabbitCelebrate 0.8s infinite alternate ease-in-out; }

        @keyframes rabbitCelebrate {
            from { transform: scale(1) rotate(-4deg); }
            to { transform: scale(1.1) rotate(4deg); }
        }

        #toast {
            position: fixed; bottom: 24px; right: 24px; background: #ff5252;
            color: white; border: 3px solid #b71c1c; box-shadow: 0 6px 0 #b71c1c;
            padding: 16px 24px; border-radius: 14px; font-size: 1.2rem; font-weight: bold;
            display: none; z-index: 999; animation: bounceShake 0.4s ease;
        }

        @keyframes bounceShake {
            0% { transform: translateY(20px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        /* 📱 IPAD & TABLET OPTIMIZATION */
        @media (max-width: 1200px) {
            #sidebar { width: 260px; }
            .brand-header h1 { font-size: 1.2rem; }
            .current-tag { font-size: 1.1rem; }
            #stage-grid {
                grid-template-columns: 320px 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 12px;
                padding: 12px;
            }
            #panel-instructions { grid-column: 1; grid-row: 1 / 3; }
            #panel-editor { grid-column: 2; grid-row: 1; }
            #panel-preview { grid-column: 2; grid-row: 2; }
            .code-textarea { font-size: 1.35rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div class="brand-header">
            <h1><span>🐰</span> Afifa's Code Quest</h1>
        </div>
        <div class="stats-bar">
            <div class="stat-pill">Level <span id="stat-level">1</span>/26</div>
            <div class="stat-pill">✨ <span id="stat-xp">0</span> XP</div>
        </div>
        <div class="syllabus-scroll" id="chapter-list"></div>
    </aside>

    <main id="workspace">
        <header id="topbar">
            <div class="current-tag" id="current-title">Chapter 1: Elements &bull; Exercise 1</div>
            <div class="action-tools">
                <button class="cartoon-btn btn-hint" onclick="toggleHint()">💡 Hint</button>
                <button class="cartoon-btn btn-reset" onclick="resetEditor()">🔄 Reset</button>
                <button class="cartoon-btn btn-check" onclick="evaluateCode()">✨ Run Code!</button>
            </div>
        </header>

        <div id="stage-grid">
            <section class="stage-box" id="panel-instructions">
                <div class="mascot-stage">
                    <svg class="bunny-svg" viewBox="0 0 100 100">
                        <ellipse cx="32" cy="24" rx="9" ry="24" fill="#ffffff" stroke="#263238" stroke-width="3" transform="rotate(-12 32 24)"/>
                        <ellipse cx="68" cy="24" rx="9" ry="24" fill="#ffffff" stroke="#263238" stroke-width="3" transform="rotate(12 68 24)"/>
                        <ellipse cx="32" cy="24" rx="4.5" ry="15" fill="#ff4081" transform="rotate(-12 32 24)"/>
                        <ellipse cx="68" cy="24" rx="4.5" ry="15" fill="#ff4081" transform="rotate(12 68 24)"/>
                        <circle cx="50" cy="62" r="34" fill="#ffffff" stroke="#263238" stroke-width="3"/>
                        <ellipse cx="36" cy="56" rx="4.5" ry="6" fill="#263238"/>
                        <ellipse cx="64" cy="56" rx="4.5" ry="6" fill="#263238"/>
                        <circle cx="38" cy="54" r="1.8" fill="#ffffff"/>
                        <circle cx="66" cy="54" r="1.8" fill="#ffffff"/>
                        <circle cx="26" cy="66" r="6" fill="#ff80ab" opacity="0.65"/>
                        <circle cx="74" cy="66" r="6" fill="#ff80ab" opacity="0.65"/>
                        <polygon points="50,64 45,61 55,61" fill="#ff4081"/>
                        <path d="M 44 68 Q 50 74 56 68" fill="none" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                    <div class="dialogue-balloon" id="sparkle-say">
                        Hi Afifa! Let's code together!
                    </div>
                </div>

                <div class="mission-body">
                    <h3 id="mission-headline">Mission</h3>
                    <div class="mission-desc" id="mission-text">Loading...</div>
                    <div class="tasks-box">
                        <h4>To Do:</h4>
                        <ul class="task-list" id="checklist"></ul>
                    </div>
                    <div class="hint-drawer" id="hint-box"></div>
                </div>
            </section>

            <section class="stage-box" id="panel-editor">
                <div class="stage-box-header" style="background: #21222c; color: #f8f8f2; border-bottom: 2px solid #44475a;">
                    <span>⌨️ Code Editor</span>
                </div>
                <textarea class="code-textarea" id="user-editor" spellcheck="false" placeholder="Write code here..."></textarea>
            </section>

            <section class="stage-box" id="panel-preview">
                <div class="stage-box-header" style="background: #e8f5e9; color: #1b5e20;">
                    <span>📺 Live Screen</span>
                </div>
                <div class="preview-frame-wrap">
                    <iframe id="preview-sandbox"></iframe>
                </div>
            </section>
        </div>
    </main>
</div>

<div id="celebration-screen">
    <svg class="big-bunny" viewBox="0 0 100 100">
        <ellipse cx="32" cy="24" rx="9" ry="24" fill="#ffffff" stroke="#263238" stroke-width="3" transform="rotate(-15 32 24)"/>
        <ellipse cx="68" cy="24" rx="9" ry="24" fill="#ffffff" stroke="#263238" stroke-width="3" transform="rotate(15 68 24)"/>
        <ellipse cx="32" cy="24" rx="4.5" ry="15" fill="#ff4081" transform="rotate(-15 32 24)"/>
        <ellipse cx="68" cy="24" rx="4.5" ry="15" fill="#ff4081" transform="rotate(15 68 24)"/>
        <circle cx="50" cy="62" r="34" fill="#ffffff" stroke="#263238" stroke-width="3"/>
        <path d="M 30 56 Q 36 48 42 56" fill="none" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 58 56 Q 64 48 70 56" fill="none" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="24" cy="66" r="7" fill="#ff80ab" opacity="0.7"/>
        <circle cx="76" cy="66" r="7" fill="#ff80ab" opacity="0.7"/>
        <polygon points="50,65 44,62 56,62" fill="#ff4081"/>
        <path d="M 42 70 Q 50 82 58 70" fill="#ff4081" stroke="#263238" stroke-width="2.5"/>
    </svg>
    <h2>GREAT JOB! 🌟</h2>
    <p id="celebration-msg">You did it!</p>
    <button class="cartoon-btn btn-check" style="font-size: 1.5rem; padding: 16px 40px;" onclick="advanceLevel()">Next Lesson 🚀</button>
</div>

<div id="toast"></div>

<script>
// EASY STORY MODE
const COURSE = [
    {
        id: 1, chapter: "1. Words", name: "Magic Blocks",
        speech: "Let's build a webpage!",
        desc: "You are a magic builder! The internet is blank paper.\n\n<h1> is a giant magic block for a title.\n<p> is a small block for a sentence.",
        starter: "",
        tasks: [
            { text: "Make an <h1> title", check: (c) => /<h1>.+<\/h1>/is.test(c) },
            { text: "Make a <p> sentence", check: (c) => /<p>.+<\/p>/is.test(c) }
        ],
        hint: "<h1>My Star</h1>\n<p>I love magic.</p>"
    },
    {
        id: 2, chapter: "1. Words", name: "Bear Sizes",
        speech: "Titles have sizes, just like bears!",
        desc: "Bears come in sizes!\n\nPapa Bear is <h1>. He is huge!\nMama Bear is <h2>. She is medium.\nBaby Bear is <h3>. He is tiny!",
        starter: "",
        tasks: [
            { text: "Make an <h1> title", check: (c) => /<h1>.+<\/h1>/is.test(c) },
            { text: "Make an <h2> title", check: (c) => /<h2>.+<\/h2>/is.test(c) },
            { text: "Make an <h3> title", check: (c) => /<h3>.+<\/h3>/is.test(c) }
        ],
        hint: "<h1>The Ocean</h1>\n<h2>Dolphins</h2>\n<h3>Fish</h3>"
    },
    {
        id: 3, chapter: "1. Words", name: "Lines & Jumps",
        speech: "Let's draw a line and jump down!",
        desc: "Let's draw magic lines!\n\n<hr> draws a line across the page.\n<br> makes your words jump down!",
        starter: "",
        tasks: [
            { text: "Make two <p> sentences", check: (c) => (c.match(/<p>/gi) || []).length >= 2 },
            { text: "Use <br> to jump", check: (c) => /<br\s*\/?>/i.test(c) },
            { text: "Use <hr> to draw a line", check: (c) => /<hr\s*\/?>/i.test(c) }
        ],
        hint: "<p>Good morning!</p>\n<hr>\n<p>Hello<br>World!</p>"
    },
    {
        id: 4, chapter: "1. Words", name: "Cool Words",
        speech: "Let's make words look super cool!",
        desc: "Make your words shout!\n\n<strong> flexes its muscles and makes words thick.\n<em> leans over and makes words slanted.",
        starter: "",
        tasks: [
            { text: "Put a word inside <strong>...</strong>", check: (c) => /<strong>.+<\/strong>/is.test(c) },
            { text: "Put a word inside <em>...</em>", check: (c) => /<em>.+<\/em>/is.test(c) }
        ],
        hint: "<p>Coding is <strong>super</strong> and <em>fun</em>!</p>"
    },
    {
        id: 5, chapter: "1. Words", name: "Making Lists",
        speech: "Let's make a list!",
        desc: "Let's bake a cake!\n\n<ul> makes a dot list for ingredients.\n<ol> makes a number list for steps.\nUse <li> for each thing!",
        starter: "",
        tasks: [
            { text: "Make a <ul> list with two <li> items", check: (c) => /<ul>\s*(<li>.*?<\/li>\s*){2,}<\/ul>/is.test(c) },
            { text: "Make an <ol> list with two <li> items", check: (c) => /<ol>\s*(<li>.*?<\/li>\s*){2,}<\/ol>/is.test(c) }
        ],
        hint: "<ul>\n<li>Sugar</li>\n<li>Flour</li>\n</ul>\n<ol>\n<li>Mix</li>\n<li>Bake</li>\n</ol>"
    },
    {
        id: 6, chapter: "1. Words", name: "Pictures",
        speech: "Let's put a cute puppy on our page!",
        desc: "Time to paint! The <img> tag is a magic painting.\n\nUse `src` to tell it what picture to paint.",
        starter: "",
        tasks: [
            { text: "Use an <img> tag", check: (c) => /<img\s+[^>]*>/i.test(c) },
            { text: "Add a src link", check: (c) => /<img\s+[^>]*src=["'][^"']+["']/i.test(c) }
        ],
        hint: '<img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200">'
    },
    {
        id: 7, chapter: "1. Words", name: "Links",
        speech: "Links are like magic doors!",
        desc: "Make a magic door! The <a> tag makes a shiny link.\n\nClick it to travel to a new webpage!",
        starter: "",
        tasks: [
            { text: "Use an <a> tag", check: (c) => /<a\s+[^>]*>.+<\/a>/is.test(c) },
            { text: "Add an href link", check: (c) => /<a\s+[^>]*href=["']https?:\/\/[^"']+["']/i.test(c) }
        ],
        hint: '<a href="https://wikipedia.org">Click Here</a>'
    },
    {
        id: 8, chapter: "2. Boxes", name: "The House",
        speech: "A webpage is built like a house!",
        desc: "Webpages are like houses!\n\n<html> is the walls.\n<head> is the brain.\n<body> is the living room where we play!",
        starter: "",
        tasks: [
            { text: "Make an <html> box", check: (c) => /<html>[\s\S]*<\/html>/i.test(c) },
            { text: "Put a <body> inside", check: (c) => /<body>[\s\S]*.+[\s\S]*<\/body>/i.test(c) }
        ],
        hint: "<html>\n<body>\n<p>Hi!</p>\n</body>\n</html>"
    },
    {
        id: 9, chapter: "2. Boxes", name: "Toys in Boxes",
        speech: "Put tags inside other tags!",
        desc: "Tags can hide inside other tags!\n\nIt is like putting a tiny toy inside a big toy box.",
        starter: "",
        tasks: [
            { text: "Put a <strong> inside a <p>", check: (c) => /<p>.*<strong>.*<\/strong>.*<\/p>/is.test(c) },
            { text: "Put a <span> inside the <strong>", check: (c) => /<strong>.*<span>.*<\/span>.*<\/strong>/is.test(c) }
        ],
        hint: "<p>The toy is <strong><span>hidden</span></strong>.</p>"
    },
    {
        id: 10, chapter: "2. Boxes", name: "The Group Box",
        speech: "The <div> tag groups things together!",
        desc: "The <div> tag is an invisible cardboard box!\n\nPut toys inside it so they don't get lost.",
        starter: "",
        tasks: [
            { text: "Make a <div> box", check: (c) => /<div>[\s\S]*<\/div>/i.test(c) },
            { text: "Put an <h2> title inside", check: (c) => /<div>[\s\S]*<h2>.+<\/h2>[\s\S]*<\/div>/is.test(c) },
            { text: "Put a <p> sentence inside", check: (c) => /<div>[\s\S]*<p>.+<\/p>[\s\S]*<\/div>/is.test(c) }
        ],
        hint: "<div>\n<h2>Bike</h2>\n<p>Fast</p>\n</div>"
    },
    {
        id: 11, chapter: "2. Boxes", name: "Tiny Wrapper",
        speech: "A <span> is a tiny wrapper for one word!",
        desc: "A <span> is a tiny wrapper!\n\nIt wraps around just one word so you can paint it a new color.",
        starter: "",
        tasks: [
            { text: "Put a <span> around a word", check: (c) => /<p>.*<span>.+<\/span>.*<\/p>/is.test(c) },
            { text: "Add a color style", check: (c) => /<span\s+style=["'][^"']+["']>/i.test(c) }
        ],
        hint: '<p>The <span style="color: purple;">fox</span> is clever.</p>'
    },

let state = { currentIndex: 0, unlockedIndex: 0, userCode: {}, xp: 0 };

function initStorage() {
    const saved = localStorage.getItem('afifa_quest_v6');
    if (saved) {
        try { state = JSON.parse(saved); } catch (e) {}
    }
}

function persistState() {
    localStorage.setItem('afifa_quest_v6', JSON.stringify(state));
}

const chapterListEl = document.getElementById('chapter-list');
const userEditorEl = document.getElementById('user-editor');
const previewFrame = document.getElementById('preview-sandbox');
const currentTitleEl = document.getElementById('current-title');
const sparkleSayEl = document.getElementById('sparkle-say');
const missionHeadlineEl = document.getElementById('mission-headline');
const missionTextEl = document.getElementById('mission-text');
const checklistEl = document.getElementById('checklist');
const hintBoxEl = document.getElementById('hint-box');
const statLevelEl = document.getElementById('stat-level');
const statXpEl = document.getElementById('stat-xp');
const toastEl = document.getElementById('toast');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type = 'sine', duration = 0.2) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playSuccessFanfare() {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'triangle', 0.3), idx * 110);
    });
}
function playErrorBloop() { playTone(220, 'sawtooth', 0.25); }

function renderSidebar() {
    chapterListEl.innerHTML = '';
    const chapters = {};

    COURSE.forEach((lvl, idx) => {
        if (!chapters[lvl.chapter]) chapters[lvl.chapter] = [];
        chapters[lvl.chapter].push({ ...lvl, idx });
    });

    for (let chapName in chapters) {
        const group = document.createElement('div');
        group.className = 'chapter-group';

        const header = document.createElement('div');
        header.className = 'chapter-header';
        header.innerHTML = `<span>${chapName}</span> <span>${chapters[chapName].filter(x => x.idx < state.unlockedIndex).length}/${chapters[chapName].length}</span>`;
        group.appendChild(header);

        chapters[chapName].forEach(item => {
            const row = document.createElement('div');
            const isCompleted = item.idx < state.unlockedIndex;
            const isCurrent = item.idx === state.currentIndex;
            const isLocked = item.idx > state.unlockedIndex;

            row.className = `exercise-item ${isCurrent ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
            row.innerHTML = `
                <div class="badge">${isCompleted ? '✓' : (item.idx + 1)}</div>
                <span>${item.name}</span>
            `;

            if (!isLocked) row.onclick = () => selectExercise(item.idx);
            group.appendChild(row);
        });

        chapterListEl.appendChild(group);
    }
    statLevelEl.innerText = state.currentIndex + 1;
    statXpEl.innerText = state.xp;
}

function selectExercise(idx) {
    state.currentIndex = idx;
    const cur = COURSE[idx];

    currentTitleEl.innerText = `${cur.chapter} • ${cur.name}`;
    sparkleSayEl.innerText = cur.speech;
    missionHeadlineEl.innerText = cur.name;
    missionTextEl.innerText = cur.desc;
    hintBoxEl.style.display = 'none';
    hintBoxEl.innerText = cur.hint;

    const savedCode = state.userCode[idx] !== undefined ? state.userCode[idx] : cur.starter;
    userEditorEl.value = savedCode;

    updateChecklist();
    updateLivePreview();
    renderSidebar();
    persistState();
}

function updateChecklist() {
    const cur = COURSE[state.currentIndex];
    const code = userEditorEl.value;
    checklistEl.innerHTML = '';

    cur.tasks.forEach(t => {
        const passed = t.check(code);
        const li = document.createElement('li');
        li.className = `task-item ${passed ? 'complete' : ''}`;
        li.innerHTML = `
            <div class="task-checkbox">${passed ? '✓' : ''}</div>
            <span>${t.text}</span>
        `;
        checklistEl.appendChild(li);
    });
}

function updateLivePreview() {
    const code = userEditorEl.value;
    const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
    doc.open(); doc.write(code); doc.close();
}

userEditorEl.addEventListener('input', () => {
    state.userCode[state.currentIndex] = userEditorEl.value;
    updateLivePreview();
    updateChecklist();
    persistState();
});

function evaluateCode() {
    const cur = COURSE[state.currentIndex];
    const code = userEditorEl.value;

    let failedTask = null;
    for (let t of cur.tasks) {
        if (!t.check(code)) {
            failedTask = t;
            break;
        }
    }

    if (failedTask) {
        playErrorBloop();
        showToast(`Keep going! You still need to: ${failedTask.text}`);
    } else {
        playSuccessFanfare();
        fireConfettiCannon();

        if (state.currentIndex === state.unlockedIndex && state.unlockedIndex < COURSE.length - 1) {
            state.unlockedIndex++;
            state.xp += 50;
        }

        persistState();
        renderSidebar();
        document.getElementById('celebration-screen').style.display = 'flex';
    }
}

function advanceLevel() {
    document.getElementById('celebration-screen').style.display = 'none';
    if (state.currentIndex < COURSE.length - 1) {
        selectExercise(state.currentIndex + 1);
    } else {
        alert("🎉 YOU WON THE WHOLE GAME!");
    }
}

function toggleHint() {
    hintBoxEl.style.display = hintBoxEl.style.display === 'block' ? 'none' : 'block';
}

function resetEditor() {
    if (confirm("Erase and start over?")) {
        userEditorEl.value = COURSE[state.currentIndex].starter;
        state.userCode[state.currentIndex] = userEditorEl.value;
        updateLivePreview();
        updateChecklist();
        persistState();
    }
}

function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    setTimeout(() => { toastEl.style.display = 'none'; }, 4000);
}

function fireConfettiCannon() {
    const count = 200;
    const defaults = { origin: { y: 0.7 } };

    function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
            particleCount: Math.floor(count * particleRatio)
        }));
    }

    fire(0.25, { spread: 26, startVelocity: 55 });
    fire(0.2, { spread: 60 });
    fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
    fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
    fire(0.1, { spread: 120, startVelocity: 45 });
}

initStorage();
selectExercise(state.currentIndex);
